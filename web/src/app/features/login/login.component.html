<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);">
  <div class="modal" style="max-width:340px;">
    <div class="modal-head" style="margin-bottom:20px;">
      <div>
        <div class="modal-title">Stake</div>
        <div class="modal-sub">Introduz a password para entrar</div>
      </div>
    </div>

    <div class="nb-grid" style="grid-template-columns:1fr;">
      <div class="nb-field">
        <label>Password</label>
        <input
          type="password"
          placeholder="••••••••"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          (keyup.enter)="submit()">
      </div>
    </div>

    @if (error()) {
      <div style="color:var(--loss);font-size:12.5px;margin-top:4px;">Password incorreta.</div>
    }

    <div class="nb-actions" style="justify-content:stretch;">
      <button class="btn-primary" style="flex:1;" [disabled]="loading()" (click)="submit()">
        {{ loading() ? 'A entrar…' : 'Entrar' }}
      </button>
    </div>
  </div>
</div>

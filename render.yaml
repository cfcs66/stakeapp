# Blueprint do Render — cria os dois serviços automaticamente a partir deste repo
# https://render.com/docs/blueprint-spec
services:
  # Frontend Angular — servido como site estático
  - type: web
    name: stake-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist/stake-ui/browser
    envVars:
      - key: API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend ASP.NET Core — corre em container Docker
  - type: web
    name: stake-api
    runtime: docker
    rootDir: api/StakeApi
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: AllowedOrigins__0
        sync: false   # URL do stake-web, depois de criado
      - key: Auth__Password
        sync: false   # a tua password de acesso à app
      - key: Auth__JwtSecret
        sync: false   # texto aleatório longo (ex: gerado por `openssl rand -base64 48`)
